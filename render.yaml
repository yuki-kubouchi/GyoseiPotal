# render.yaml

databases:
  - name: gyosei-potal-db
    databaseName: gyosei_potal_production
    user: gyosei_potal_user
    plan: free

services:
  - type: web
    name: gyosei-potal
    env: ruby
    buildCommand: "bundle install && bundle exec rails assets:precompile && bundle exec rails assets:clean"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RACK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gyosei-potal-db
          property: connectionString
    plan: free
